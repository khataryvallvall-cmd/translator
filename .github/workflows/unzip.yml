name: Unzip
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip files
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -d .
            rm -f "$z"
          done
          rm -f index-*.html
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract zip" || echo "nothing to commit"
          git push
